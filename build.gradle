plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id 'com.modrinth.minotaur' version '2.+'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = "${project.mod_name}-${project.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs(
                    "guilib/src",
                    "linkableapi/src",
                    "contentPackLib/src"
            )
        }
    }
}

neoForge {
    version = project.neoforge_version

    accessTransformers.from(
            file("src/main/resources/META-INF/accesstransformer.cfg")
    )

    runs {
        client {
            client()

            gameDirectory = project.file("run")

            systemProperty "forge.logging.console.level", "debug"
        }

        server {
            server()

            systemProperty "forge.logging.console.level", "debug"
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                "Specification-Title": project.mod_name,
                "Specification-Vendor": "troblecodings",
                "Specification-Version": project.version,
                "Implementation-Title": project.mod_name,
                "Implementation-Version": project.version,
                "Implementation-Vendor": "troblecodings",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        )
    }
}

def key = System.getenv("CURSETOKEN") ?: "dev"

curseforge {
    apiKey = key

    project {
        id = project.curseforge_project_id

        changelog = file("changelog.md")
        changelogType = "markdown"

        releaseType = "release"

        addGameVersion project.minecraft_version
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = project.modrinth_project_id

    versionNumber = project.version
    versionName = "${project.mod_name} ${project.version}"

    uploadFile = tasks.jar

    gameVersions = [project.minecraft_version]
    loaders = ["neoforge"]

    changelog = file("changelog.md").text
}

tasks.register("publishMods") {
    dependsOn("curseforge", "modrinth")
}