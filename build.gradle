buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.+'
        classpath "gradle.plugin.com.matthewprenger:CurseGradle:1.4.0"
        classpath "com.modrinth.minotaur:Minotaur:2.+"
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'com.matthewprenger.cursegradle'
apply plugin: 'com.modrinth.minotaur'

group = project.mod_group
version = project.mod_version

base {
    archivesName = "${project.mod_name}-${project.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
}

sourceSets {
    main {
        java {
            srcDirs(
                "guilib/src/",
                "linkableapi/src/",
                "contentPackLib/src"
            )
        }
    }
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version

    accessTransformer = file(
        'src/main/resources/META-INF/accesstransformer.cfg'
    )

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand(
            version: project.version,
            mcversion: project.minecraft_version,
            forgeversion: project.forge_version_main,
            modid: project.mod_id,
            modname: project.mod_name,
            author: project.mod_author
        )
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": project.mod_name,
            "Specification-Vendor": "troblecodings",
            "Specification-Version": project.version,
            "Implementation-Title": project.mod_name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "troblecodings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

def key = System.getenv("CURSETOKEN")
if (key == null)
    key = 'dev'

curseforge {
    apiKey = key 

    project {
        id = project.curseforge_project_id

        changelog = file("changelog.md")
        changelogType = "markdown"

        releaseType = "release"

        addGameVersion project.minecraft_version
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = project.modrinth_project_id

    versionNumber = project.version
    versionName = "${project.mod_name} ${project.version}"

    uploadFile = jar

    gameVersions = [project.minecraft_version]
    loaders = [project.loader]

    changelog = file("changelog.md").text
}

tasks.register("publishMods") {
    dependsOn("curseforge", "modrinth")
}